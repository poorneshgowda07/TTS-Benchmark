[tool.poetry]
name = "tts-benchmark"
version = "0.1.0"
description = "Production-grade TTS Benchmarking & Evaluation Framework for Voice AI Agents"
authors = ["AI Assistant"]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.27.0"
websockets = "^12.0"
pydantic = "^2.6.0"
pyyaml = "^6.0.1"
tqdm = "^4.66.0"
python-dotenv = "^1.0.1"
jiwer = "^3.0.3" # For Word Error Rate
numpy = "^1.26.0"
soundfile = "^0.12.1"
pandas = "^2.2.0"
tabulate = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
